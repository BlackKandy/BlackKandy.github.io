<!-- Recreated photographic hero - mobile approximation -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Studio singer hero mobile">
  <defs>
    <linearGradient id="mg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <radialGradient id="mspot" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mg)" />
  <rect width="800" height="600" fill="url(#mspot)" />
  <g transform="translate(40,80)">
    <rect x="0" y="0" width="720" height="440" rx="8" fill="#121212"/>
    <ellipse cx="360" cy="220" rx="140" ry="160" fill="#1a1a1a"/>
  </g>
  <rect width="800" height="600" fill="rgba(0,0,0,0.42)" />
</svg>
