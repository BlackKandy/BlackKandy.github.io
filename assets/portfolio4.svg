<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Portfolio 4 - cinematic portrait">
  <defs>
    <linearGradient id="p4" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#151516"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="1">
      <stop offset="0%" stop-color="#cda1ff"/>
      <stop offset="100%" stop-color="#6f1a82"/>
