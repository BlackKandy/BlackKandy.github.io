<!-- Polished SVG logo approximation for BLACK KANDY MEDIA -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="BLACK KANDY MEDIA logo">
  <defs>
    <linearGradient id="pb" x1="0" x2="1">
      <stop offset="0%" stop-color="#b362ff"/>
      <stop offset="100%" stop-color="#6f1a82"/>
    </linearGradient>
    <radialGradient id="gloss" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="#050506" rx="0"/>

  <!-- BK mark: glossy B and stylized K -->
  <g transform="translate(60,20)" filter="url(#soft)">
    <!-- Back K shape (flat) -->
    <path d="M520 40 L700 40 L840 200 L700 360 L520 360 L640 220 L520 40 Z" fill="#0a0a0b" stroke="#111" stroke-opacity="0.9" stroke-width="2"/>
    <!-- Front B gloss (rounded) -->
    <path d="M100 40 C160 40 200 80 200 140 C200 200 160 240 100 240 L100 360 L260 360 C320 360 380 320 380 260 C380 200 340 160 280 140 C340 130 380 110 380 60 C380 20 320 0 260 0 L100 0 Z" transform="translate(40,40)" fill="#0b0b0c" stroke="#141414" stroke-width="2"/>
    <!-- Gloss overlay -->
    <rect x="60" y="20" width="560" height="320" rx="6" fill="url(#gloss)" opacity="0.14"/>
    <!-- Dynamic scrape across BK -->
    <path d="M420 40 C430 140 460 180 520 220" stroke="#070707" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" fill="none"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(120,300)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#eaeaea" letter-spacing="6">BLACK</text>
    <text x="220" y="0" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="url(#pb)" font-weight="700" letter-spacing="6">KANDY</text>
    <line x1="0" y1="18" x2="560" y2="18" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <text x="0" y="48" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#a8a9ae" letter-spacing="8">MEDIA</text>
  </g>
</svg>
