<!-- Hero tablet placeholder (1600x700) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hero tablet placeholder">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1">
      <stop offset="0%" stop-color="#070708"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </linearGradient>
    <radialGradient id="spot2" cx="45%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#bg2)" />
  <rect width="1600" height="700" fill="url(#spot2)" />
  <circle cx="1300" cy="180" r="140" fill="#6f1a82" opacity="0.08"/>
  <text x="80" y="640" fill="#a9a9ad" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22">Hero tablet placeholder</text>
</svg>
