<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="700" viewBox="0 0 1920 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Studio singer hero">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- background base -->
  <rect width="1920" height="700" fill="url(#g1)" />

  <!-- soft studio spot (more visible) -->
  <rect width="1920" height="700" fill="url(#spot)" />

  <!-- left singer silhouette with mic and stand -->
  <g transform="translate(90,80)" opacity="0.98">
    <path d="M80 420 C60 320 80 260 140 220 C180 200 220 200 260 220 C300 240 320 300 320 360 L80 420 Z" fill="#161616"/>
    <ellipse cx="170" cy="155" rx="44" ry="52" fill="#1d1d1d"/>
    <rect x="40" y="60" width="40" height="320" rx="6" fill="#111" transform="rotate(-6 60 220)"/>
  </g>

  <!-- center close-up: face & headphones suggestion (brighter highlight) -->
  <g transform="translate(660,40)" filter="url(#softShadow)">
    <rect x="0" y="0" width="600" height="520" rx="8" fill="#1a1a1a"/>
    <ellipse cx="320" cy="240" rx="170" ry="200" fill="#222"/>
    <ellipse cx="310" cy="210" rx="80" ry="90" fill="#2a2a2a"/>
    <!-- headphones arc -->
    <path d="M160 80 C200 20 460 20 500 80" stroke="#0b0b0b" stroke-width="36" stroke-linecap="round" fill="none" opacity="0.98"/>
    <!-- mic pop filter faint -->
    <circle cx="420" cy="300" r="54" fill="#0b0b0b" opacity="0.95"/>
  </g>

  <!-- right silhouette backlit (subtle rim) -->
  <g transform="translate(1380,70)">
    <path d="M40 420 C80 260 140 180 200 120 C260 60 320 50 380 110 C440 170 480 300 480 360 L40 420 Z" fill="#161616"/>
    <!-- small stage lights hint brighter -->
    <circle cx="440" cy="40" r="18" fill="#ffffff" opacity="0.12"/>
    <circle cx="480" cy="24" r="10" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- subtle grain overlay to emulate photo texture -->
  <g opacity="0.04">
    <rect width="1920" height="700" fill="#0b0b0b"/>
  </g>

  <!-- dark vignette (lighter) -->
  <rect width="1920" height="700" fill="rgba(0,0,0,0.35)" />
</svg>
