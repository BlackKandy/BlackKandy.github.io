<!-- Hero background - desktop (SVG approximation of the provided studio photo in monochrome) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="700" viewBox="0 0 1920 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="vign" x1="0" x2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="50%" stop-color="rgba(0,0,0,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="1920" height="700" fill="#0b0b0b" />
  <!-- Left singer silhouette -->
  <g transform="translate(60,60)">
    <ellipse cx="160" cy="320" rx="120" ry="220" fill="#111"/>
    <ellipse cx="160" cy="200" rx="80" ry="90" fill="#0f0f0f"/>
  </g>
  <!-- Center close-up face suggestion -->
  <g transform="translate(640,40)">
    <rect x="0" y="0" width="640" height="520" rx="6" fill="#121212"/>
    <circle cx="320" cy="240" r="180" fill="#1a1a1a" opacity="0.9"/>
  </g>
  <!-- Right backlit silhouette -->
  <g transform="translate(1360,80)">
    <path d="M100 400 C150 250 220 180 260 130 C300 80 360 60 420 120 C480 180 520 300 520 360 L100 400 Z" fill="#0e0e0e"/>
  </g>
  <!-- soft vignette -->
  <rect width="1920" height="700" fill="url(#vign)" />
</svg>
